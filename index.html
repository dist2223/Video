<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перегляд відео</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            position: relative;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        /* Прозорий шар для блокування кліків правою кнопкою миші */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85%;
            z-index: 10;
        }
        iframe {
            display: block;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container" oncontextmenu="return false;">
        <div class="video-overlay"></div>
        <iframe src="https://drive.google.com/file/d/1JFeuAAzUXAHb3Mh1Hv6NjwsB8GDjjqoW/preview" 
                width="640" height="360" 
                allow="autoplay">
        </iframe>
    </div>

</body>
</html>
