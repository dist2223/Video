<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Захищений перегляд відео</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .generator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: none;
        }
        .generator-card h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
        }
        .generator-card input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .generator-card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.2s;
        }
        .generator-card button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            word-break: break-all;
            display: none;
            text-align: left;
            font-size: 14px;
        }
        .result-box input {
            width: 100%;
            margin-top: 5px;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background: #fff;
        }

        /* Стилі для плеєра */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        
        /* 1. Блокувальник на правий верхній кут (кнопка "Відкрити в новому вікні") */
        .top-right-blocker {
            position: absolute;
            top: 0;
            right: 0;
            width: 70px;
            height: 70px;
            z-index: 20;
            background: transparent;
        }

        /* 2. Точковий блокувальник на меню налаштувань / швидкість (правий нижній кут панелі) */
        .settings-blocker {
            position: absolute;
            bottom: 0;
            right: 70px; /* Зміщено лівіше, щоб залишити місце для кнопки повного екрана */
            width: 70px;
            height: 50px;
            z-index: 20;
            background: transparent;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .error-message {
            color: #d9534f;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            display: none;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- ГЕНЕРАТОР -->
    <div class="generator-card" id="generatorCard">
        <h2>Генератор посилань на відео</h2>
        <p style="color: #666; font-size: 14px;">Вставте посилання на файл з Google Диска:</p>
        
        <div>
            <input type="text" id="driveLinkInput" placeholder="https://drive.google.com/file/d/.../view?usp=sharing">
            <button type="button" id="generateBtn">Згенерувати посилання</button>
        </div>
        
        <div class="result-box" id="resultBox">
            <strong>Готове посилання для студентів:</strong>
            <input type="text" id="resultLinkInput" readonly onclick="this.select()">
            <p style="font-size: 12px; color: #666; margin-top: 8px; margin-bottom: 0;">Натисніть на поле, щоб виділити, та скопіюйте посилання.</p>
        </div>
    </div>

    <!-- ПЛЕЄР -->
    <div class="video-container" id="videoContainer" oncontextmenu="return false;">
        <div class="top-right-blocker"></div>
        <div class="settings-blocker"></div>
        <iframe id="videoFrame" allow="autoplay" allowfullscreen></iframe>
    </div>

    <!-- ПОМИЛКА -->
    <div id="errorMessage" class="error-message">
        <strong>Помилка:</strong> Невірне посилання або файл не знайдено. Перевірте доступ на Google Диску.
    </div>

    <script>
        function extractDriveId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const fullLink = urlParams.get('url');

        if (fullLink) {
            const fileId = extractDriveId(fullLink);
            if (fileId) {
                const iframe = document.getElementById('videoFrame');
                iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
                document.getElementById('videoContainer').style.display = 'block';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        } else {
            document.getElementById('generatorCard').style.display = 'block';
        }

        document.getElementById('generateBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const inputVal = document.getElementById('driveLinkInput').value.trim();
            const fileId = extractDriveId(inputVal);

            if (!fileId) {
                alert('Помилка! Переконайтеся, що ви повністю скопіювали та вставили посилання з Google Диска.');
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const finalLink = `${baseUrl}?url=${encodeURIComponent(inputVal)}`;

            document.getElementById('resultLinkInput').value = finalLink;
            document.getElementById('resultBox').style.display = 'block';
        });
    </script>

</body>
</html>
