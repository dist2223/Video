<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перегляд відео</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            position: relative;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: none; /* Приховано за замовчуванням */
        }
        /* Прозорий шар для блокування контекстного меню */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85%;
            z-index: 10;
        }
        iframe {
            display: block;
            border: none;
        }
        .error-message {
            color: #d9534f;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer" oncontextmenu="return false;">
        <div class="video-overlay"></div>
        <iframe id="videoFrame" width="640" height="360" allow="autoplay"></iframe>
    </div>

    <div id="errorMessage" class="error-message">
        Помилка: перевірте правильність посилання на відео у строці браузера.
    </div>

    <script>
        // Функція автоматично витягує ID з повного посилання Google Диска
        function extractDriveId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        // Зчитуємо параметр ?url= з адресного рядка
        const urlParams = new URLSearchParams(window.location.search);
        const fullLink = urlParams.get('url');

        if (fullLink) {
            const fileId = extractDriveId(fullLink);
            
            if (fileId) {
                // Якщо ID успішно знайдено, вбудовуємо його у відеоплеєр
                const iframe = document.getElementById('videoFrame');
                iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
                document.getElementById('videoContainer').style.display = 'inline-block';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        } else {
            document.getElementById('errorMessage').style.display = 'block';
        }
    </script>

</body>
</html>
